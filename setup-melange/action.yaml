name: 'Setup melange'
description: |
  Sets up melange, so it can run in an Ubuntu environment.

inputs:
  version:
    description: 'Version of melange to install (tip, latest-release, v0.5.5, etc.)'
    required: true
    default: 'latest-release'

runs:
  using: 'composite'

  steps:
    - name: 'Install qemu emulator binaries'
      shell: bash
      run: |
        sudo apt update
        # Ubuntu 26.04+ ships the static emulators in qemu-user-binfmt;
        # qemu-user-static is only a virtual package there.
        sudo apt install -y qemu-user-static || sudo apt install -y qemu-user-binfmt
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        check-latest: true
        cache: false
    - name: 'Install dependencies'
      shell: bash
      run: |
        sudo apt install -y build-essential git jq

    - name: 'Install dependencies (bubblewrap)'
      shell: bash
      run: |
        sudo apt install --assume-yes bubblewrap

    - name: Enable bubblewrap in ubuntu
      shell: bash
      run: |
        set -x
        # https://github.com/chainguard-dev/melange/issues/1508
        # Ubuntu 26.04+ ships its own bwrap profile, and adding ours breaks it.
        if ! bwrap --unshare-user --bind / / true ; then
          sudo tee /etc/apparmor.d/local-bwrap <<"EOF"
        abi <abi/4.0>,
        include <tunables/global>

        profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          # Site-specific additions and overrides. See local/README for details.
          include if exists <local/bwrap>
        }
        EOF

          sudo systemctl reload apparmor
        fi
        if ! bwrap --unshare-user --bind / / true ; then
          echo "FATAL: failed to verify 'bwrap --unshare-user'"
          which bwrap || :
          ls /proc/self/ns || echo "no /proc/self/ns"
          kver=$(uname -r) || echo "uname -r failed"
          if config="/boot/config-$kver" && [ -f "$config" ]; then
            grep CONFIG_USER_NS "$config" || echo "no CONFIG_USER_NS in $config"
          fi
          exit 1
        fi
        echo "bubblewrap (bwrap) installed successfully."

    # Used to verify the signed checksums.txt of the melange release.
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      if: ${{ inputs.version != 'tip' }}

    - name: 'Install melange'
      if:
      env:
        INPUTS_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -ex

        # Install melange:
        # - if version is "tip", install from tip of main.
        # - if version is "latest-release", look up latest release.
        # - otherwise, install the specified version.
        case "${INPUTS_VERSION}" in
        tip)
          TMP_CLONE_DIR="$(mktemp -d)"
          git clone https://github.com/chainguard-dev/melange "${TMP_CLONE_DIR}"
          pushd "${TMP_CLONE_DIR}"
          make melange
          sudo env "PATH=$PATH" make install
          popd
          rm -rf "${TMP_CLONE_DIR}"
          ;;
        latest-release)
          # fetch the latest 20 releases, we need to filter by the ones that have assets.
          tmpf=$(mktemp)
          url="https://api.github.com/repos/chainguard-dev/melange/releases/latest"
          curl --fail -s -u "username:${GITHUB_TOKEN}" "$url" > "$tmpf" ||
            { echo "error in github api call for latest melange release"; exit 1; }
          tag=$(jq -r .tag_name < "$tmpf") ||
            { echo "error parsing json from $url"; exit 1; }

          if [ -z "$tag" ]; then
            # this should, ideally, never happen.
            echo "No melange release with assets found"
            exit 1
          fi
          rm -f "$tmpf"
          echo "Found 'latest-release' for melange is '$tag'"
          ;;
        *)
          tag="${INPUTS_VERSION}"
          ;;
        esac

        if [[ ! -z ${tag} ]]; then
          case "$(echo "$RUNNER_ARCH" | awk '{print tolower($0)}')" in
          x86|x64) ARCH=amd64;;
          arm64)   ARCH=arm64;;
          *)
            echo "Unsupported RUNNER_ARCH \"${RUNNER_ARCH}\""
            exit 1
            ;;
          esac
          case "$(echo "$RUNNER_OS" | awk '{print tolower($0)}')" in
          "linux") OS=linux;;
          "macos") OS=darwin;;
          *)
            echo "Unsupported RUNNER_OS \"${RUNNER_OS}\""
            exit 1
            ;;
          esac

          without_v=${tag#"v"}
          echo "Installing melange @ ${tag}"
          base="https://github.com/chainguard-dev/melange/releases/download/${tag}"
          tarball="melange_${without_v}_${OS}_${ARCH}.tar.gz"
          dl="$(mktemp -d)"
          for f in "${tarball}" checksums.txt checksums.txt.sig checksums.txt.crt; do
            curl -fsSL -o "${dl}/${f}" "${base}/${f}"
          done

          # checksums.txt is signed keylessly by melange's release workflow
          # (from main since ~v0.11, from the tag before that). Check the
          # signature, then the tarball against it, before extracting.
          cosign verify-blob \
            --certificate "${dl}/checksums.txt.crt" \
            --signature "${dl}/checksums.txt.sig" \
            --certificate-identity-regexp '^https://github\.com/chainguard-dev/melange/\.github/workflows/release\.yaml@refs/(heads/main|tags/v[0-9][^/]*)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${dl}/checksums.txt"
          want="$(awk -v f="${tarball}" '$2 == f { print $1 }' "${dl}/checksums.txt")"
          if [[ -z "${want}" ]]; then
            echo "::error::no checksum for ${tarball} in melange ${tag} checksums.txt"
            exit 1
          fi
          echo "${want}  ${dl}/${tarball}" | shasum -a 256 --check --strict

          sudo tar xzf "${dl}/${tarball}" --strip-components=1 -C /usr/local/bin
          rm -rf "${dl}"
        fi

        melange version
