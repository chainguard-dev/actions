name: "Where Am I"
description: |
  This action logs some Azure metadata about the runner environment.

runs:
  using: "composite"
  steps:
    - uses: wolfi-dev/wolfi-act@634e2600f741167ba9e84313f66e144f3661086f # zizmor: ignore[stale-action-refs] wolfi-act has no tagged releases; pinned to main commit from May 5, 2025
      with:
        packages: curl,jq
        command: |
          curl -s -H "Metadata:true" --noproxy "*" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq
