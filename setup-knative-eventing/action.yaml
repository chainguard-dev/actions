name: 'Setup Knative Eventing'
description: |
  This action sets up Knative Eventing on the current
  kubectl context (typically KinD from setup-kind).

inputs:
  version:
    description: |
      The version of Knative to install, e.g. 1.23.1
    required: false
    default: 1.23.1

runs:
  using: "composite"

  steps:
    # Used to verify the signed checksums.txt of the Knative release.
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install Knative
      id: knative
      env:
        INPUTS_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        # Download the release's checksums.txt and check its keyless cosign
        # signature from Knative's release signer once, up front. Knative
        # has signed its checksums since about v1.11.
        VERIFY_DIR="$(mktemp -d)"
        BASE_URL="https://github.com/knative/eventing/releases/download/knative-v${INPUTS_VERSION}"
        CURL_OPTS=(-fsSL --retry 5 --retry-all-errors --retry-delay 2)
        for f in checksums.txt checksums.txt.sig checksums.txt.pem; do
          if ! curl "${CURL_OPTS[@]}" -o "${VERIFY_DIR}/${f}" "${BASE_URL}/${f}"; then
            echo "::error::knative/eventing v${INPUTS_VERSION} has no ${f}, so it can't be verified (Knative signs releases since about v1.11)"
            exit 1
          fi
        done
        cosign verify-blob \
          --certificate "${VERIFY_DIR}/checksums.txt.pem" \
          --signature "${VERIFY_DIR}/checksums.txt.sig" \
          --certificate-identity signer@knative-releases.iam.gserviceaccount.com \
          --certificate-oidc-issuer https://accounts.google.com \
          "${VERIFY_DIR}/checksums.txt"

        # Eliminates the resources blocks in a release yaml. Only a file
        # matching the verified checksums.txt reaches yq and kubectl; on a
        # mismatch kubectl gets no input and pipefail fails the step.
        function resource_blaster() {
          local FILE="${1}"
          local want

          curl "${CURL_OPTS[@]}" -o "${VERIFY_DIR}/${FILE}" "${BASE_URL}/${FILE}"
          want="$(awk -v f="${FILE}" '$2 == f { print $1 }' "${VERIFY_DIR}/checksums.txt")"
          if [ -z "${want}" ]; then
            echo "::error::no checksum for ${FILE} in knative/eventing v${INPUTS_VERSION} checksums.txt" >&2
            return 1
          fi
          echo "${want}  ${VERIFY_DIR}/${FILE}" | shasum -a 256 --check --strict >&2

          yq e 'del(.spec.template.spec.containers[]?.resources)' "${VERIFY_DIR}/${FILE}" \
            `# Filter out empty objects that come out as {} b/c kubectl barfs` \
            | grep -v '^{}$'
        }

        resource_blaster eventing-crds.yaml | kubectl apply -f -
        resource_blaster eventing-core.yaml | kubectl apply -f -
        resource_blaster in-memory-channel.yaml | kubectl apply -f -
        resource_blaster mt-channel-broker.yaml | kubectl apply -f -

        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: imc-channel
          namespace: knative-eventing
        data:
          channelTemplateSpec: |
            apiVersion: messaging.knative.dev/v1
            kind: InMemoryChannel
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: config-br-defaults
          namespace: knative-eventing
        data:
          default-br-config: |
            # This is the cluster-wide default broker channel.
            clusterDefault:
              brokerClass: MTChannelBasedBroker
              apiVersion: v1
              kind: ConfigMap
              name: imc-channel
              namespace: knative-eventing
        EOF

        # Wait for Knative to be ready (or webhook will reject services)
        for x in $(kubectl get deploy --namespace knative-eventing -oname); do
          kubectl rollout status --timeout 5m --namespace knative-eventing "$x"
        done

