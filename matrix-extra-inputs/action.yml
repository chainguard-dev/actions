name: 'Augment a GitHub Actions build matrix to contain extra inputs.'
description: |
  This action is designed to be used to augment
  a GitHub Actions build matrix to contain extra inputs.

inputs:
  matrix-json:
    required: true
    description: |
      The original GitHub Actions matrix inputs JSON.
    default: '{}'

outputs:
  matrix-json:
    description: |
      The updated GitHub Actions matrix inputs JSON.
    value: ${{ steps.matrix-extra-inputs.outputs.matrix-json }}

runs:
  using: "composite"
  steps:
    - name: Add additional matrix inputs
      id: matrix-extra-inputs
      env:
        INPUTS_MATRIX_JSON: ${{ inputs.matrix-json }}
      shell: bash
      run: |
        echo "Original matrix:"
        echo "----------------"
        printf '%s\n' "${INPUTS_MATRIX_JSON}" | jq

        # Merge in every env var beginning with "EXTRA_INPUT_", camelCasing
        # the rest of its name (EXTRA_INPUT_FOO_BAR=x -> {"fooBar": "x"}).
        # jq reads names and values from its own `env`, so they are data,
        # never filter text, and values keep every '=', quote and space.
        updated_matrix="$(printf '%s\n' "${INPUTS_MATRIX_JSON}" | jq -c '
          def camel: ascii_downcase | gsub("(?<a>.)_+(?<b>.)"; .a + (.b | ascii_upcase));
          . + (env
               | with_entries(select(.key | startswith("EXTRA_INPUT_"))
                              | .key |= (ltrimstr("EXTRA_INPUT_") | camel)))
        ')"
        echo "matrix-json=${updated_matrix}" >> "$GITHUB_OUTPUT"
        echo "Updated matrix:"
        echo "----------------"
        echo "${updated_matrix}" | jq
