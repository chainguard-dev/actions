name: 'Build image with apko'
description: |
  This action build an OCI image with apko, given a config file
  and tag to use.

inputs:
  config:
    description: |
      The config file to use for building the image.
    default: .apko.yaml

  tag:
    description: |
      The tag to use for publishing the image.
    required: true

  repository_owner:
    description: |
      The repository owner's GitHub username.
    default: ${{ github.repository_owner }}

  token:
    description: |
      The repository owner's GitHub token.
    default: ${{ github.token }}

  image_refs:
    description: |
      The value to pass to --image-refs.
    default: /tmp/apko.images

  keyring-append:
    description: |
      The value to pass to --keyring-append.
    default: ''

  archs:
    description: |
      The architectures to build for.
    default: ''

  source-date-epoch:
    description: |
      The UNIX timestamp to use as the source date when building an image.
      This is set as the SOURCE_DATE_EPOCH environment variable.
    default: ''

  use-docker-mediatypes:
    description: |
      Use Docker mediatypes for building the image.
    type: boolean
    required: false

outputs:
  digest:
    description: |
      The digest of the published container image.


runs:
  using: docker
  image: "docker://ghcr.io/wolfi-dev/apko:latest@sha256:5fe0f6b8be743ca11d6363733259b48fdb3cf959d6ee9f661c13d680ac0050b0"
  env:
    # Set up go-containerregistry's GitHub keychain.
    GITHUB_ACTOR: ${{ inputs.repository_owner }}
    GITHUB_TOKEN: ${{ inputs.token }}
    # Inputs reach the script only as env vars, never pasted into its text,
    # so a value like `x; curl … | sh` stays data.
    INPUT_CONFIG: ${{ inputs.config }}
    INPUT_TAG: ${{ inputs.tag }}
    INPUT_IMAGE_REFS: ${{ inputs.image_refs }}
    INPUT_KEYRING_APPEND: ${{ inputs.keyring-append }}
    INPUT_ARCHS: ${{ inputs.archs }}
    INPUT_SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
    INPUT_USE_DOCKER_MEDIATYPES: ${{ inputs.use-docker-mediatypes }}
  entrypoint: /bin/sh
  args:
    - '-c'
    - |
      set -o errexit

      echo "***************************************************************************************"
      echo "This action will be deprecated, please use chainguard-images/actions/apko-publish@main instead"
      echo "***************************************************************************************"

      [ -n "${INPUT_SOURCE_DATE_EPOCH}" ] && export SOURCE_DATE_EPOCH="${INPUT_SOURCE_DATE_EPOCH}"

      set --
      [ "${INPUT_USE_DOCKER_MEDIATYPES}" = "true" ] && set -- "$@" --use-docker-mediatypes
      set -- "$@" --image-refs="${INPUT_IMAGE_REFS}"

      # config, tag, keyring-append and archs were always word-split (a
      # space-separated list of tags is valid), so keep splitting them, but
      # with globbing off. Splitting never runs code.
      set -f
      # shellcheck disable=SC2086
      set -- "$@" ${INPUT_CONFIG} ${INPUT_TAG}
      # shellcheck disable=SC2086
      [ -n "${INPUT_KEYRING_APPEND}" ] && set -- "$@" -k ${INPUT_KEYRING_APPEND}
      # shellcheck disable=SC2086
      [ -n "${INPUT_ARCHS}" ] && set -- "$@" --arch ${INPUT_ARCHS}
      set +f

      /usr/bin/apko publish "$@"
      echo "digest=$(cat "${INPUT_IMAGE_REFS}")" >> "$GITHUB_OUTPUT"
