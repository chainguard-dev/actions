rules:
  # adjust the default cooldown for non-security dependabot updates
  # to 3 days, down from 7.
  dependabot-cooldown:
    config:
      days: 3
  anonymous-definition:
    disable: true
  undocumented-permissions:
    disable: true
  concurrency-limits:
    disable: true
  # `$/` self-repository refs are rejected by actionlint 1.7.12, which this
  # repo runs in CI, so local actions stay on `./`.
  self-repository:
    disable: true
