name: test-gitsign

on:
  pull_request:
    paths:
      - 'setup-gitsign/**'
      - '.github/workflows/test-gitsign.yaml'

permissions: {}

jobs:
  test_gitsign_action:

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-14
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-11-arm
          - windows-latest

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    name: Install Gitsign and test presence in path
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: block
        # The sectigo.com/lencr.org entries are the OCSP, CRL and AIA endpoints
        # named in the certificate chains for github.com (Sectigo) and
        # release-assets.githubusercontent.com (Let's Encrypt). Windows Schannel
        # fetches them during the TLS handshake and fails closed when they are
        # unreachable, so curl exits 35 without them. They are plain HTTP.
        allowed-endpoints: >
          *.blob.core.windows.net:443
          *.c.lencr.org:80
          *.githubapp.com:443
          *.i.lencr.org:80
          crl.sectigo.com:80
          crt.sectigo.com:80
          github.com:443
          ocsp.sectigo.com:80
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Gitsign
      uses: ./setup-gitsign

    - name: Check install!
      run: gitsign --version

    - name: Check root directory
      run: |
        if [[ $(git diff --stat) != '' ]]; then
          echo 'should be clean'
          exit 1
        else
          exit 0
        fi
      shell: bash
